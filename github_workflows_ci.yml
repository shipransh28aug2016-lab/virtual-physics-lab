name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/gen-catalogue.mjs --check
      - run: npm test
      - run: npm run build
      - run: npm run build:portable

      # The placement audit needs a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run audit
      - run: npm run audit:portable